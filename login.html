<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangkit — Masuk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="mark">
      <img src="logo/bangkit.svg" class="mark-glyph" alt="Logo Bangkit">
      <div class="mark-word">Bangkit</div>
    </div>

    <h1 class="auth-title">Masuk</h1>
    <p class="auth-sub">Masuk menggunakan email dan password akun kamu.</p>

    <div id="error-msg" class="field-error" style="margin-bottom: 14px;"></div>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email-input" placeholder="contoh@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password-input" placeholder="Masukkan password" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 14px;">Masuk</button>
    </form>

    <div class="auth-divider"><span>atau</span></div>

    <button type="button" id="google-login-btn" class="btn btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.51 0-6.377-2.87-6.377-6.4 0-3.53 2.867-6.4 6.377-6.4 1.582 0 3.02.58 4.14 1.536l3.014-3.015C19.314 2.33 15.996 1 12.24 1 5.926 1 1 5.925 1 12.2s4.926 11.2 11.24 11.2c6.512 0 10.814-4.58 10.814-11 0-.662-.053-1.303-.153-1.915H12.24z"/>
      </svg>
      Masuk dengan Google
    </button>

    <div class="auth-foot">
      Belum punya akun? <a href="register.html">Daftar</a>
    </div>
  </div>
</div>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  // Tampilkan peringatan jika Firebase belum dikonfigurasi
  if (typeof isFirebaseConfigured !== "undefined" && !isFirebaseConfigured) {
    document.getElementById("firebase-alert") && (document.getElementById("firebase-alert").style.display = "block");
  }

  redirectIfLoggedIn();

  const errEl = document.getElementById("error-msg");

  // Form submit — login dengan email + password
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";

    const email = document.getElementById("email-input").value.trim();
    const password = document.getElementById("password-input").value;

    if (!email || !password) {
      errEl.textContent = "Harap isi email dan password.";
      errEl.style.display = "block";
      return;
    }

    showPageLoading();

    const result = await loginUser({ email, password });
    if (result.ok) {
      const user = getCurrentUser();
      if (user && !user.onboarded) {
        navigateTo("onboarding.html");
      } else {
        navigateTo("dashboard.html");
      }
    } else {
      errEl.textContent = result.error;
      errEl.style.display = "block";
    }
  });

  // Google login
  document.getElementById("google-login-btn").addEventListener("click", async () => {
    if (typeof isFirebaseConfigured !== "undefined" && !isFirebaseConfigured) return;
    errEl.style.display = "none";

    showPageLoading();

    const result = await loginWithGoogle();
    if (result.ok) {
      const user = getCurrentUser();
      if (user && !user.onboarded) {
        navigateTo("onboarding.html");
      } else {
        navigateTo("dashboard.html");
      }
    } else {
      errEl.textContent = result.error;
      errEl.style.display = "block";
    }
  });
</script>
</body>
</html>
