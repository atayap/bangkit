<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangkit — Pengaturan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="mark">
      <img src="logo/bangkit.svg" class="mark-glyph" alt="Logo Bangkit">
      <div class="mark-word">Bangkit</div>
    </div>
    <ul class="nav-list">
      <li><a href="dashboard.html"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg> Dasbor</a></li>
      <li><a href="scan.html"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg> Scan</a></li>
      <li><a href="progress.html"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Progres</a></li>
      <li><a href="chat.html"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Diskusi</a></li>
      <li><a href="history.html"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Riwayat</a></li>
      <li><a href="settings.html" class="active"><svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.10a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Setelan</a></li>
    </ul>
    <div class="sidebar-foot">
      <div class="user-chip">
        <span id="sidebar-name">—</span>
        <span class="lv-badge" id="sidebar-level" style="margin-left:auto;">LV 1</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <div class="eyebrow">Akun</div>
        <h1>Pengaturan</h1>
      </div>
    </div>

    <div class="grid grid-2" style="align-items:start; margin-bottom:30px;">
      <div class="card" style="max-width:100%;">
        <div class="card-title">Profil</div>
        <div class="field">
          <label>Username</label>
          <div id="setting-username" style="font-size:16px; font-weight:600; color:var(--bone);">—</div>
        </div>
        <div class="field" style="margin-top:14px;">
          <label>Akun Google</label>
          <div id="setting-email" style="font-size:13px; color:var(--ash); word-break:break-all;">—</div>
        </div>
      </div>

      <div class="card" style="max-width:100%; border-color: rgba(220, 53, 69, 0.25);">
        <div class="card-title" style="color: #ff6b6b;">Akun & Sesi</div>
        <p style="font-size:13px; color:var(--ash); margin-bottom:16px; line-height:1.5;">
          Keluar dari akun Anda saat ini di perangkat ini. Semua data progres pengerjaan tugas & data gizi Anda tetap tersimpan secara privat.
        </p>
        <button type="button" class="btn btn-danger btn-block" id="logout-btn">Keluar dari Akun</button>
      </div>
    </div>
  </main>
</div>

<button class="hint-btn" id="hint-btn" title="Bantuan / Pengenalan ulang">?</button>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/api-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/levels.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/app.js"></script>
<script>
  requireAuth();
  renderSidebarUser();
  initTutorial();

  // Tampilkan Username & Email di halaman Pengaturan
  const user = getCurrentUser();
  if (user) {
    document.getElementById("setting-username").textContent = user.name || "—";
    document.getElementById("setting-email").textContent = user.email || "—";
  }

  document.getElementById("logout-btn").addEventListener("click", logoutUser);
</script>
</body>
</html>
